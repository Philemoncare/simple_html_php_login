<!DOCTYPE html>
<html>

<head>
    <title>Register</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="form-container">
        <h2>User Registration</h2>

        <form id="registerForm">

            <input type="text" name="fullname" placeholder="Full Name" required>

            <input type="email" name="email" placeholder="Email" required>

            <input type="text" name="username" placeholder="Username" required>

            <input type="password" name="password" placeholder="Password" required>

            <button type="submit" name="register">Register</button>

        </form>

        <p>Already have an account? <a href="login.html">Login</a></p>

        <div id="message-container"></div>

    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault(); // Prevent default full-page reload
            
            const formData = new FormData(this);
            formData.append('register', 'true');

            fetch('register.php', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                const messageContainer = document.getElementById('message-container');
                if (data.status === 'success') {
                    messageContainer.innerHTML = `<div class="success-message">${data.message}</div>`;
                    // Redirect seamlessly after a short delay
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 1500); 
                } else {
                    messageContainer.innerHTML = `<div class="error-message">${data.message}</div>`;
                }
            })
            .catch(error => {
                console.error('Error:', error);
                document.getElementById('message-container').innerHTML = `<div class="error-message">An unexpected error occurred. Please try again.</div>`;
            });
        });
    </script>
</body>
</html>
